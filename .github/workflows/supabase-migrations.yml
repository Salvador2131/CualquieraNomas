name: Supabase Migrations

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:
    inputs:
      skip_verification:
        description: "Skip migration verification"
        required: false
        default: "false"

jobs:
  migrate:
    name: Run Supabase Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Supabase CLI
        run: |
          echo "Instalando Supabase CLI desde GitHub releases..."
          # Descargar el binario directamente (no tar.gz)
          curl -L https://github.com/supabase/cli/releases/download/v2.67.3/supabase_2.67.3_linux_amd64 -o supabase
          chmod +x supabase
          sudo mv supabase /usr/local/bin/
          supabase --version

      - name: Install dependencies (skip supabase package)
        run: |
          # Instalar dependencias excluyendo supabase para evitar el error de postinstall
          npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "❌ Error: SUPABASE_PROJECT_REF no está configurado"
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ Error: SUPABASE_ACCESS_TOKEN no está configurado"
            exit 1
          fi
          echo "🔗 Vinculando proyecto: $SUPABASE_PROJECT_REF"
          supabase link --project-ref $SUPABASE_PROJECT_REF || true

      - name: List pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "📋 Migraciones pendientes:"
          if command -v supabase &> /dev/null; then
            supabase migration list || echo "No se pudieron listar migraciones"
          else
            npx supabase migration list || echo "No se pudieron listar migraciones"
          fi

      - name: Run migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🚀 Aplicando migraciones..."
          supabase db push
          if [ $? -eq 0 ]; then
            echo "✅ Migraciones aplicadas exitosamente"
          else
            echo "❌ Error al aplicar migraciones"
            exit 1
          fi

      - name: Verify migration status
        if: ${{ github.event.inputs.skip_verification != 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "🔍 Verificando estado de migraciones..."
          supabase migration list

      - name: Migration Summary
        if: always()
        run: |
          echo "## 📊 Resumen de Migración" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Estado**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Proyecto**: ${{ secrets.SUPABASE_PROJECT_REF }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
