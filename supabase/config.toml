# Supabase Configuration
# Este archivo configura Supabase CLI para trabajar con tu proyecto
# El project_id se configura con: supabase link --project-ref <project-ref>

[auth]
# Configuración de autenticación
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://*.vercel.app"]
jwt_expiry = 3600
enable_signup = true

[api]
# Configuración de API
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Configuración de base de datos
port = 54322
shadow_port = 54320
major_version = 17

[studio]
# Configuración de Supabase Studio
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
# Configuración de Inbucket (para emails de desarrollo)
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
# Configuración de Storage
enabled = true
file_size_limit = "50MiB"

[auth.email]
# Configuración de emails
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
